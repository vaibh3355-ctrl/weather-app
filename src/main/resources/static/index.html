<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather</title>
<style>
  :root {
    --paper: #eef2f4; --card: #ffffff; --ink: #13232d; --muted: #56707f;
    --line: #d3dde3; --accent: #0e6a8a; --accent-ink: #ffffff; --warn: #a23b2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0f1b22; --card: #172830; --ink: #e8f0f4; --muted: #8fa9b8;
      --line: #28404c; --accent: #5fb7d4; --accent-ink: #0f1b22; --warn: #f09a88;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.5;
  }
  main { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=text] {
    flex: 1 1 200px; padding: 12px 14px; font-size: 1rem; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  }
  select, button {
    padding: 12px 16px; font-size: 1rem; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink);
  }
  button { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); cursor: pointer; font-weight: 600; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #status { margin: 24px 0 0; color: var(--muted); }
  #status.error { color: var(--warn); }
  .now { margin-top: 28px; padding: 28px 0 24px; border-bottom: 1px solid var(--line); }
  .place { margin: 0; color: var(--muted); font-size: 1.05rem; }
  .temp { font-family: Georgia, "Times New Roman", serif; font-size: clamp(4.5rem, 20vw, 7.5rem); line-height: 1; margin: 6px 0 4px; letter-spacing: -0.03em; }
  .cond { font-size: 1.3rem; margin: 0 0 18px; }
  .facts { display: flex; gap: 28px; flex-wrap: wrap; margin: 0; }
  .facts div { min-width: 90px; }
  .facts dt { color: var(--muted); font-size: .9rem; }
  .facts dd { margin: 0; font-size: 1.25rem; font-weight: 600; }
  h2 { font-size: 1.1rem; margin: 28px 0 8px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.day { display: grid; grid-template-columns: 1fr 1.4fr auto auto; gap: 12px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .day .name { font-weight: 600; }
  .day .c { color: var(--muted); }
  .day .rain { color: var(--muted); font-size: .9rem; }
  .day .range { font-variant-numeric: tabular-nums; text-align: right; }
  .day .lo { color: var(--muted); }
  @media (max-width: 480px) { li.day { grid-template-columns: 1fr auto; } .day .c { grid-column: 1; } .day .rain { grid-column: 2; text-align: right; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <form id="form">
    <input type="text" id="city" name="city" placeholder="City, e.g. Roorkee" aria-label="City" required maxlength="100">
    <select id="units" aria-label="Units">
      <option value="metric">°C</option>
      <option value="imperial">°F</option>
    </select>
    <button type="submit">Get weather</button>
  </form>

  <p id="status" role="status">Enter a city to see current conditions and the next 5 days.</p>

  <section id="result" hidden>
    <div class="now">
      <p class="place" id="place"></p>
      <p class="temp" id="temp"></p>
      <p class="cond" id="cond"></p>
      <dl class="facts">
        <div><dt>Feels like</dt><dd id="feels"></dd></div>
        <div><dt>Humidity</dt><dd id="hum"></dd></div>
        <div><dt>Wind</dt><dd id="wind"></dd></div>
      </dl>
    </div>
    <h2>5-day forecast</h2>
    <ul id="days"></ul>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);
  const statusEl = $("status"), result = $("result");

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.className = isError ? "error" : "";
    statusEl.hidden = !msg;
  }

  function render(w) {
    const u = w.temperatureUnit;
    $("place").textContent = w.country ? `${w.city}, ${w.country}` : w.city;
    $("temp").textContent = `${Math.round(w.current.temperature)}${u}`;
    $("cond").textContent = w.current.condition;
    $("feels").textContent = `${Math.round(w.current.feelsLike)}${u}`;
    $("hum").textContent = `${w.current.humidity}%`;
    $("wind").textContent = `${Math.round(w.current.windSpeed)} ${w.windUnit}`;

    const list = $("days");
    list.replaceChildren();
    w.forecast.forEach((d, i) => {
      const li = document.createElement("li");
      li.className = "day";
      const name = i === 0 ? "Today" :
        new Date(d.date + "T00:00:00").toLocaleDateString(undefined, { weekday: "long" });
      const cells = ["name", "c", "rain", "range"].map(cls => {
        const s = document.createElement("span");
        s.className = cls;
        return s;
      });
      cells[0].textContent = name;
      cells[1].textContent = d.condition;
      cells[2].textContent = `${d.precipitationChance}% rain`;
      const lo = document.createElement("span");
      lo.className = "lo";
      lo.textContent = ` ${Math.round(d.tempMin)}${u}`;
      cells[3].append(`${Math.round(d.tempMax)}${u}`, lo);
      li.append(...cells);
      list.appendChild(li);
    });
    result.hidden = false;
  }

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const city = $("city").value.trim();
    if (!city) return;
    setStatus("Loading…");
    result.hidden = true;
    try {
      const res = await fetch(`/api/weather?city=${encodeURIComponent(city)}&units=${$("units").value}`);
      if (!res.ok) {
        const problem = await res.json().catch(() => ({}));
        throw new Error(problem.detail || "Something went wrong. Try again.");
      }
      render(await res.json());
      setStatus("");
    } catch (err) {
      setStatus(err.message, true);
    }
  });
</script>
</body>
</html>
